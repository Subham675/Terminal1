server {
    listen 80;
    server_name localhost;

    root /var/www/terminal1/public;
    index index.php index.html;

    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~ \.(sql|log|md)$       { deny all; return 404; }

    location /uploads/ {
        location ~ \.php$ { deny all; return 403; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 3600s;
        # Buffering OFF globally: our SSE endpoints (/track/stream, /admin/track/stream)
        # go through this same front-controller (index.php) via the try_files rewrite
        # above, so nginx can't tell them apart by URL at this point. Turning buffering
        # off everywhere is the simple, correct trade-off for a small app like this —
        # a high-traffic site would instead run SSE on its own dedicated path/upstream.
        fastcgi_buffering off;
    }

    client_max_body_size 10M;
}
